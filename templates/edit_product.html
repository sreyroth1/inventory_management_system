{% extends "base.html" %}

{% block title %}Edit Product - Inventory Management System{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Edit Product</h1>
        <p class="text-gray-600">Update the product details below</p>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Product Name -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        Product Name *
                    </label>
                    <input type="text" id="name" name="name" value="{{ product.name }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- SKU -->
                <div>
                    <label for="sku" class="block text-sm font-medium text-gray-700 mb-2">
                        SKU (Stock Keeping Unit) *
                    </label>
                    <input type="text" id="sku" name="sku" value="{{ product.sku }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Category -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-2">
                        Category *
                    </label>
                    <select id="category" name="category" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Select a category</option>
                        <option value="Drink" {% if product.category == 'Drink' %}selected{% endif %}>Hot Drink</option>
                        <option value="Books" {% if product.category == 'Books' %}selected{% endif %}>Ice Drink</option>
                        <option value="Bread" {% if product.category == 'Bread' %}selected{% endif %}>Bread</option>
                        <option value="Sports" {% if product.category == 'Sports' %}selected{% endif %}>Snack</option>
                        <option value="Beauty" {% if product.category == 'Beauty' %}selected{% endif %}>Beauty</option>
                        <option value="Toys" {% if product.category == 'Toys' %}selected{% endif %}>Toys</option>
                        <option value="Other" {% if product.category == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <!-- Price -->
                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700 mb-2">
                        Price ($) *
                    </label>
                    <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Quantity -->
                <div>
                    <label for="quantity" class="block text-sm font-medium text-gray-700 mb-2">
                        Quantity *
                    </label>
                    <input type="number" id="quantity" name="quantity" min="0" value="{{ product.quantity }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                    Description
                </label>
                <textarea id="description" name="description" rows="4"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ product.description or '' }}</textarea>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
                <a href="/" 
                   class="px-6 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition duration-200">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200 flex items-center">
                    <i class="fas fa-save mr-2"></i>
                    Update Product
                </button>
                <a href="{{ url_for('view_product_page', id=product.id) }}" 
   class="text-blue-600 hover:text-blue-800 font-medium">
   View
</a>

            </div>
        </form>
    </div>
</div>
{% endblock %}
