{% extends "base.html" %}

{% block title %}Edit Product - Inventory Management System{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Edit Product</h1>
        <p class="text-sm text-gray-600">Update the product details below</p>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
        <form method="POST" class="space-y-6">
            <!-- First Row: Product Name, SKU, Category -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Product Name -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                        Product Name *
                    </label>
                    <input type="text" id="name" name="name" value="{{ product.name }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- SKU -->
                <div>
                    <label for="sku" class="block text-sm font-medium text-gray-700 mb-1">
                        SKU (Stock Keeping Unit) *
                    </label>
                    <input type="text" id="sku" name="sku" value="{{ product.sku }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Category -->
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700 mb-1">
                        Category *
                    </label>
                    <select id="category" name="category" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Select a category</option>
                        <option value="Beauty" {% if product.category == 'Beauty' %}selected{% endif %}>Natural & Organic Skincare</option>
                        <option value="Face Care" {% if product.category == 'Face Care' %}selected{% endif %}>Body & Beauty Care</option>
                        <option value="Body Care" {% if product.category == 'Body Care' %}selected{% endif %}>Sun & Skin Protection</option>
                        <option value="Body & Face" {% if product.category == 'Body & Face' %}selected{% endif %}>Hair & Scalp Care</option>
                        <option value="Hair" {% if product.category == 'Hair' %}selected{% endif %}>Facial Care Products</option>
                        <option value="Face Care" {% if product.category == 'Face Care' %}selected{% endif %}>Natural Skincare</option>
                        <option value="Other" {% if product.category == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <!-- Second Row: Price and Quantity -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Price -->
                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700 mb-1">
                        Price ($) *
                    </label>
                    <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Quantity -->
                <div>
                    <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">
                        Quantity *
                    </label>
                    <input type="number" id="quantity" name="quantity" min="0" value="{{ product.quantity }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Third Row: Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
                    Description
                </label>
                <textarea id="description" name="description" rows="3"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ product.description or '' }}</textarea>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                <a href="/" 
                   class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition duration-200">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200 flex items-center">
                    <i class="fas fa-save mr-1.5"></i>
                    Update Product
                </button>
                <a href="{{ url_for('view_product', id=product.id) }}" 
                   class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition duration-200">
                    View
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
