{% extends "base.html" %}

{% block title %}Create Order - Inventory Management System{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Create New Order</h1>
        <p class="text-sm text-gray-600">Add products and customer details to create an order</p>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <form method="POST" id="orderForm">
            <!-- Customer Information -->
            <div class="mb-8">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Customer Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="customer_name" class="block text-sm font-medium text-gray-700 mb-1">Customer Name *</label>
                        <input type="text" id="customer_name" name="customer_name" required 
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="customer_email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="customer_email" name="customer_email" 
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="customer_phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="text" id="customer_phone" name="customer_phone" 
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Order Status</label>
                        <select id="status" name="status" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="pending">Pending</option>
                            <option value="completed">Completed</option>
                            <option value="shipped">Shipped</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4">
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Order Notes</label>
                    <textarea id="notes" name="notes" rows="2" 
                              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"></textarea>
                </div>
            </div>

            <!-- Order Items -->
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-gray-800">Order Items</h3>
                    <button type="button" id="addItem" class="bg-blue-600 text-white px-3 py-1 rounded-md text-sm hover:bg-blue-700">
                        <i class="fas fa-plus mr-1"></i>Add Item
                    </button>
                </div>
                
                <div id="orderItems" class="space-y-4">
                    <!-- Items will be added here dynamically -->
                </div>
                
                <!-- Total Amount -->
                <div class="mt-6 pt-4 border-t border-gray-200">
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-semibold text-gray-800">Total Amount:</span>
                        <span id="totalAmount" class="text-2xl font-bold text-green-600">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                <a href="/orders" class="px-4 py-2 text-sm border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition duration-200">
                    Cancel
                </a>
                <button type="submit" class="px-4 py-2 text-sm bg-green-600 text-white rounded-md hover:bg-green-700 transition duration-200">
                    <i class="fas fa-check mr-1"></i>Create Order
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Product Selection Modal -->
<div id="productModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-900">Select Product</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="mb-4">
                <input type="text" id="productSearch" placeholder="Search products..." 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            
            <div id="productList" class="max-h-60 overflow-y-auto">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>
</div>

<script>
let products = [];
let currentItemIndex = null;

// Load products
fetch('/api/products')
    .then(response => response.json())
    .then(data => {
        products = data;
    });

// Add item button
document.getElementById('addItem').addEventListener('click', function() {
    openProductModal(null);
});

function openProductModal(index) {
    currentItemIndex = index;
    document.getElementById('productModal').classList.remove('hidden');
    renderProductList();
}

function closeModal() {
    document.getElementById('productModal').classList.add('hidden');
}

function renderProductList() {
    const searchTerm = document.getElementById('productSearch').value.toLowerCase();
    const productList = document.getElementById('productList');
    
    const filteredProducts = products.filter(product => 
        product.name.toLowerCase().includes(searchTerm) ||
        product.category.toLowerCase().includes(searchTerm)
    );
    
    productList.innerHTML = filteredProducts.map(product => `
        <div class="p-3 border-b border-gray-200 hover:bg-gray-50 cursor-pointer" 
             onclick="selectProduct(${product.id})">
            <div class="flex justify-between items-center">
                <div>
                    <div class="font-medium">${product.name}</div>
                    <div class="text-sm text-gray-500">${product.category} - $${product.price.toFixed(2)}</div>
                </div>
                <div class="text-sm text-gray-500">Stock: ${product.quantity}</div>
            </div>
        </div>
    `).join('');
}

function selectProduct(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    
    const itemId = currentItemIndex !== null ? currentItemIndex : Date.now();
    
    const itemHtml = `
        <div class="border border-gray-200 rounded-md p-4" id="item-${itemId}">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product</label>
                    <input type="text" value="${product.name}" readonly 
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md bg-gray-50">
                    <input type="hidden" name="product_id[]" value="${product.id}">
                    <input type="hidden" name="product_name[]" value="${product.name}">
                    <input type="hidden" name="product_price[]" value="${product.price}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Price</label>
                    <input type="number" value="${product.price}" step="0.01" readonly 
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                    <input type="number" name="quantity[]" value="1" min="1" max="${product.quantity}" 
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
                           onchange="updateItemTotal(${itemId})">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total</label>
                    <div class="flex items-center">
                        <input type="text" id="total-${itemId}" value="$${product.price.toFixed(2)}" readonly 
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md bg-gray-50">
                        <button type="button" onclick="removeItem(${itemId})" class="ml-2 text-red-600 hover:text-red-800">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    if (currentItemIndex !== null) {
        document.getElementById(`item-${currentItemIndex}`).outerHTML = itemHtml;
    } else {
        document.getElementById('orderItems').insertAdjacentHTML('beforeend', itemHtml);
    }
    
    closeModal();
    calculateTotal();
}

function removeItem(itemId) {
    document.getElementById(`item-${itemId}`).remove();
    calculateTotal();
}

function updateItemTotal(itemId) {
    const quantityInput = document.querySelector(`#item-${itemId} input[name="quantity[]"]`);
    const price = parseFloat(document.querySelector(`#item-${itemId} input[name="product_price[]"]`).value);
    const quantity = parseInt(quantityInput.value);
    const total = price * quantity;
    
    document.getElementById(`total-${itemId}`).value = `$${total.toFixed(2)}`;
    calculateTotal();
}

function calculateTotal() {
    const items = document.querySelectorAll('[id^="item-"]');
    let total = 0;
    
    items.forEach(item => {
        const price = parseFloat(item.querySelector('input[name="product_price[]"]').value);
        const quantity = parseInt(item.querySelector('input[name="quantity[]"]').value);
        total += price * quantity;
    });
    
    document.getElementById('totalAmount').textContent = `$${total.toFixed(2)}`;
}

// Search functionality
document.getElementById('productSearch').addEventListener('input', renderProductList);

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('productModal');
    if (event.target === modal) {
        closeModal();
    }
}
</script>
{% endblock %}
